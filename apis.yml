aid: legendary-entertainment
name: Legendary Entertainment
description: 'Legendary Entertainment is a Burbank, California based global media company
  that owns, produces, and delivers content to worldwide audiences through three divisions:
  Legendary Pictures (film), Legendary Television and Digital Media (television and digital
  content), and Legendary Comics. The company builds and licenses media properties aimed at
  the fandom demographic, with productions that have generated over $20 billion in worldwide
  box office, including the Dune, Godzilla and Kong Monsterverse, Pokemon Detective Pikachu,
  Minecraft, and Street Fighter franchises, plus the Monarch: Legacy of Monsters series.
  Legendary was surfaced in the API Evangelist network as a portfolio company of IDG Capital.
  It operates no public developer program: no developer portal, API documentation, or API
  reference is published, and developer.legendary.com, api.legendary.com, and
  docs.legendary.com do not resolve. Its only machine-readable public surfaces are an
  llms.txt link index, an RSS news feed, and an XML sitemap on the marketing site.'
